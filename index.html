<!DOCTYPE html>
<html lang="zh-CN" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Universe</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;-webkit-touch-callout:default}
button{font-family:inherit}

:root{
  --bg-win:rgba(32,32,40,.82);--bg-panel:rgba(20,20,26,.72);--bg-menu:rgba(40,40,48,.94);
  --bg-input:rgba(255,255,255,.08);--bg-hover:rgba(255,255,255,.14);--bg-toolbar:rgba(0,0,0,.16);
  --bg-fill:rgba(255,255,255,.05);--text:#fff;--text-soft:rgba(255,255,255,.88);
  --text-dim:rgba(255,255,255,.55);--text-mute:rgba(255,255,255,.35);
  --border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.18);
  --shadow:0 24px 60px rgba(0,0,0,.5);--shadow-menu:0 16px 40px rgba(0,0,0,.5);
  --accent:#4da3ff;--accent-hover:#6db5ff;--danger:#ff6b6b;--warn:#ffb340;--ok:#34c759;
  --scrollbar:rgba(255,255,255,.18);
}
html[data-mode="light"]{
  --bg-win:rgba(245,246,250,.92);--bg-panel:rgba(235,236,242,.94);--bg-menu:rgba(250,250,254,.97);
  --bg-input:rgba(0,0,0,.05);--bg-hover:rgba(0,0,0,.08);--bg-toolbar:rgba(0,0,0,.03);
  --bg-fill:rgba(0,0,0,.04);--text:#1a1a1f;--text-soft:rgba(0,0,0,.82);
  --text-dim:rgba(0,0,0,.52);--text-mute:rgba(0,0,0,.35);
  --border:rgba(0,0,0,.09);--border-strong:rgba(0,0,0,.14);
  --shadow:0 20px 50px rgba(0,0,0,.18);--shadow-menu:0 12px 32px rgba(0,0,0,.15);
  --accent:#0066ff;--accent-hover:#2b7fff;--scrollbar:rgba(0,0,0,.18);
}

/* ============ 启动动画 ============ */
#bootScreen{position:fixed;inset:0;z-index:999999;background:#000;display:flex;align-items:center;justify-content:center;
  overflow:hidden;transition:opacity .9s cubic-bezier(.4,0,.2,1);will-change:opacity}
#bootScreen.fade-out{opacity:0;pointer-events:none}
#bootScreen.hidden{display:none}
.boot-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.boot-parts{position:absolute;display:flex;align-items:baseline;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:clamp(48px,10vw,120px);font-weight:900;letter-spacing:-.04em;color:#fff;white-space:nowrap;pointer-events:none}
.bp{display:inline-block}

@keyframes partIn{
  0%{opacity:0;transform:translateY(.18em);filter:blur(8px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translateY(0);filter:blur(0)}
}
.bp-uni-wrap,.bp-ver-wrap,.bp-swap-wrap{display:inline-block}
.bp-uni,.bp-ver,.bp-se,.bp-os{display:inline-block;opacity:0}
.bp-uni{animation:partIn .9s cubic-bezier(.16,1,.3,1) 0s forwards}
.bp-ver{animation:partIn .9s cubic-bezier(.16,1,.3,1) .12s forwards}
.bp-se {animation:partIn .9s cubic-bezier(.16,1,.3,1) .24s forwards}

@keyframes moveUni{
  0%{transform:translateX(0);animation-timing-function:cubic-bezier(.45,.05,.55,.95)}
  50%{transform:translateX(-.08em);animation-timing-function:cubic-bezier(.3,0,.5,1)}
  70%{transform:translateX(-.13em);animation-timing-function:cubic-bezier(.4,0,.6,1)}
  100%{transform:translateX(-.14em)}
}
@keyframes moveVer{
  0%{transform:translateX(0);animation-timing-function:cubic-bezier(.45,.05,.55,.95)}
  50%{transform:translateX(.04em);animation-timing-function:cubic-bezier(.3,0,.5,1)}
  70%{transform:translateX(.055em);animation-timing-function:cubic-bezier(.4,0,.6,1)}
  100%{transform:translateX(.06em)}
}
@keyframes moveSwap{
  0%{transform:translateX(0);animation-timing-function:cubic-bezier(.45,.05,.55,.95)}
  50%{transform:translateX(.08em);animation-timing-function:cubic-bezier(.3,0,.5,1)}
  70%{transform:translateX(.16em);animation-timing-function:cubic-bezier(.4,0,.6,1)}
  100%{transform:translateX(.18em)}
}
.boot-parts.expanded .bp-uni-wrap{animation:moveUni 1.4s cubic-bezier(.4,0,.6,1) forwards}
.boot-parts.expanded .bp-ver-wrap{animation:moveVer 1.4s cubic-bezier(.4,0,.6,1) forwards}
.boot-parts.expanded .bp-swap-wrap{animation:moveSwap 1.4s cubic-bezier(.4,0,.6,1) forwards}

.bp-gap{display:inline-block;position:relative;width:0;overflow:visible;transition:width 1.4s cubic-bezier(.4,0,.6,1)}
.boot-parts.expanded .bp-gap{width:2.6em}
.bp-version{position:absolute;left:50%;top:.08em;transform:translateX(-50%) translateY(.3em) scale(.5);
  font-size:.22em;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.72);
  font-variant-numeric:tabular-nums;opacity:0;
  transition:opacity .8s ease 1.5s,transform 1.2s cubic-bezier(.16,1,.3,1) 1.5s;
  white-space:nowrap;pointer-events:none}
.boot-parts.expanded .bp-version{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

.bp-swap-wrap{position:relative;display:inline-block}
.bp-swap-wrap .bp-se,.bp-swap-wrap .bp-os{display:inline-block;white-space:nowrap}
.bp-swap-wrap .bp-os{position:absolute;left:0;top:0}

.boot-parts.expanded .bp-se{animation:seFadeOut .9s cubic-bezier(.4,0,.6,1) 1.5s forwards}
.boot-parts.expanded .bp-os{animation:osFadeIn .9s cubic-bezier(.4,0,.6,1) 1.5s forwards}
@keyframes seFadeOut{0%{opacity:1}100%{opacity:0}}
@keyframes osFadeIn{0%{opacity:0}100%{opacity:1}}

@keyframes bootBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
.boot-parts.expanded{animation:bootBreath 4s ease-in-out infinite 3s}

/* ============ 桌面 ============ */
#desktop{position:fixed;inset:0;overflow:hidden;transition:transform .35s cubic-bezier(.4,0,.2,1)}
html.forced-landscape #desktop{inset:auto;width:100vh;height:100vw;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}
#ui-layer{position:fixed;inset:0;pointer-events:none;z-index:10000}
#ui-layer>*{pointer-events:auto}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .6s ease}
#wallpaper::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.07),transparent 60%),
             radial-gradient(100% 100% at 50% 110%,rgba(0,0,0,.45),transparent 55%)}

#statusbar{position:fixed;top:0;left:0;right:0;height:26px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;background:transparent;font-size:11px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.5);
  z-index:11000;touch-action:none;pointer-events:none;user-select:none}
#statusbar>*{pointer-events:auto}
html.forced-landscape #statusbar{transform:rotate(90deg);transform-origin:0 0;left:100vw;top:0;width:100vh;height:26px}
html[data-mode="light"] #statusbar{color:#1a1a1f;text-shadow:0 1px 2px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,.6)}
.sb-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0;font-weight:500}
.sb-apple{font-size:11px;line-height:1;opacity:.95;padding:2px 0}
.sb-appname{font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-menus{display:flex;align-items:center;gap:10px}
.sb-menu-item{padding:1px 2px;font-size:11px;cursor:pointer;white-space:nowrap;opacity:.85}
.sb-menu-item:hover{opacity:1}
.sb-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.sb-icon{display:flex;align-items:center;justify-content:center;width:14px;height:14px;cursor:pointer;opacity:.95}
.sb-icon svg{display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.6))}
html[data-mode="light"] .sb-icon svg{filter:drop-shadow(0 1px 1.5px rgba(255,255,255,.7))}
.sb-battery{display:flex;align-items:center;gap:3px;font-size:10.5px;font-variant-numeric:tabular-nums}
.sb-time{font-size:11px;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
@media (max-width:760px){#statusbar{height:24px;padding:0 10px;font-size:10.5px}.sb-menus{display:none}.sb-right{gap:6px}}

#icons-layer{position:absolute;inset:0;touch-action:none;padding-top:28px}
.desk-icon{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  touch-action:none;cursor:default;transition:left .2s cubic-bezier(.22,1,.36,1),top .2s cubic-bezier(.22,1,.36,1)}
.desk-icon.dragging{transition:none;z-index:900;filter:drop-shadow(0 16px 26px rgba(0,0,0,.55))}
.desk-icon .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  border:1px solid var(--border-strong);box-shadow:0 6px 16px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .15s,filter .15s}
.desk-icon .ic svg{width:56%;height:56%;display:block}
.desk-icon .lb{font-size:11.5px;line-height:1.3;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);
  max-width:100%;padding:1px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[data-mode="light"] .desk-icon .lb{color:#1a1a1f;text-shadow:0 1px 2px rgba(255,255,255,.9)}
.desk-icon.pressed .ic{transform:scale(.94);filter:brightness(1.1)}
.desk-icon.menu-anchor .ic{filter:brightness(1.22) drop-shadow(0 0 8px rgba(255,255,255,.3))}
.desk-icon.desk-new{animation:deskIn .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes deskIn{0%{opacity:0;transform:scale(.4) translateY(-18px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.desk-icon.desk-leaving{animation:deskOut .26s cubic-bezier(.4,0,.6,1) forwards;pointer-events:none}
@keyframes deskOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
#ghost{position:absolute;border-radius:16px;pointer-events:none;opacity:0;z-index:1;
  background:rgba(255,255,255,.1);border:1.5px dashed rgba(255,255,255,.45);transition:opacity .15s}
#ghost.on{opacity:1}
@keyframes iconPopOut{0%{transform:scale(1)}26%{transform:scale(.78)}56%{transform:scale(1.22)}78%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes iconPopIn{0%{transform:scale(1)}32%{transform:scale(1.24)}66%{transform:scale(.82)}100%{transform:scale(1)}}
.desk-icon.icon-pop-out .ic,.dock-item.icon-pop-out .di-ic{animation:iconPopOut .52s cubic-bezier(.34,1.4,.64,1)}
.desk-icon.icon-pop-in .ic,.dock-item.icon-pop-in .di-ic{animation:iconPopIn .52s cubic-bezier(.34,1.4,.64,1)}

#win-layer{position:absolute;inset:0;pointer-events:none}
.window{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:250px;min-height:170px;
  border-radius:15px;overflow:hidden;background:var(--bg-win);
  backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  box-shadow:var(--shadow),0 0 0 1px var(--border);transition:box-shadow .2s}
.window.focused{box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1px var(--border-strong)}
.window.entering{animation:winIn .42s cubic-bezier(.22,1,.36,1) both}
@keyframes winIn{0%{opacity:0;transform:scale(.08)}50%{opacity:1}76%{transform:scale(1.016)}100%{opacity:1;transform:scale(1)}}
.window.closing,.window.minimizing{animation:winOut .3s cubic-bezier(.4,0,.6,1) forwards;pointer-events:none}
@keyframes winOut{0%{opacity:1;transform:scale(1)}30%{transform:scale(1.022)}100%{opacity:0;transform:scale(.08)}}
.win-bar{flex:0 0 42px;height:42px;display:flex;align-items:center;gap:12px;padding:0 12px;
  background:linear-gradient(var(--border),rgba(0,0,0,0));border-bottom:1px solid var(--border);touch-action:none;cursor:default}
.traffic{display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;position:relative;color:#fff}
html[data-mode="light"] .traffic{color:#1a1a1f}
.tl{width:12px;height:12px;border-radius:50%;border:none;padding:0;cursor:pointer;position:relative;transition:background .15s,width .2s,height .2s,opacity .18s}
.tl::after{content:'';position:absolute;inset:-9px}
.tl.close{background:#ff5f57}.tl.min{background:#febc2e}.tl.max{background:#28c840}
.window:not(.focused) .tl.close,.window:not(.focused) .tl.min,.window:not(.focused) .tl.max{background:#8e8e93}
@media (pointer:coarse),(max-width:760px){
  .traffic{width:44px;height:26px;border-radius:13px;background:var(--bg-input);gap:0;overflow:hidden;color:inherit;
    transition:width .28s cubic-bezier(.22,1,.36,1),height .22s,border-radius .28s,background .22s,gap .28s,padding .28s;cursor:pointer}
  .traffic::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor;
    box-shadow:-8px 0 0 currentColor,8px 0 0 currentColor;transition:opacity .15s,width .15s,box-shadow .15s}
  .window:not(.focused) .traffic:not(.expanded){background:rgba(142,142,147,.28);color:#c7c7cc}
  .traffic .tl{width:0;height:0;opacity:0;pointer-events:none}
  .traffic.expanded{width:auto;height:32px;padding:0 14px;gap:11px;border-radius:16px;background:var(--bg-menu);overflow:visible}
  .traffic.expanded::before{opacity:0;width:0;box-shadow:none}
  .traffic.expanded .tl{width:14px;height:14px;opacity:1;pointer-events:auto}
  .traffic.expanded .tl::after{inset:-12px}
  .window:not(.focused) .traffic.expanded .tl.close,.window:not(.focused) .traffic.expanded .tl.min,.window:not(.focused) .traffic.expanded .tl.max{background:#7a7a80}
}
.win-title{font-size:13px;font-weight:600;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-body{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.win-resize{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;z-index:5}
.win-resize::after{content:'';position:absolute;right:9px;bottom:9px;width:8px;height:8px;
  border-right:1.8px solid var(--text-dim);border-bottom:1.8px solid var(--text-dim);border-bottom-right-radius:3px;pointer-events:none}

:root{--dock-item-size:52px;--dock-icon-size:48px;--dock-gap:8px;--dock-radius:22px;--dock-pad-y:8px}
#dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:var(--dock-gap);
  padding:var(--dock-pad-y) 10px;border-radius:var(--dock-radius);z-index:600;
  background:var(--bg-input);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--border-strong);box-shadow:0 14px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.2);
  touch-action:none;max-width:calc(100vw - 16px);
  transition:transform .38s cubic-bezier(.32,.72,.34,1),background .15s,box-shadow .15s}
#dock.docked{transform:translateX(-50%) translateY(calc(100% + 30px))}
#dock.dock-target{background:rgba(255,179,64,.28);box-shadow:0 14px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.2),0 0 0 2px #ffb340}
.dock-sep{width:1px;height:calc(var(--dock-item-size)*.7);background:var(--border-strong);margin:0 2px;flex:0 0 auto}
.dock-inner{display:flex;align-items:center;gap:var(--dock-gap);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-width:calc(100vw - 100px)}
.dock-inner::-webkit-scrollbar{display:none}
.dock-item{width:var(--dock-item-size);height:var(--dock-item-size);padding:0;
  border-radius:calc(var(--dock-item-size)*.27);display:grid;place-items:center;position:relative;cursor:pointer;border:none;background:none;flex:0 0 auto;
  transition:transform .18s cubic-bezier(.2,.9,.3,1.5),opacity .18s,filter .18s;touch-action:none}
.dock-item .di-ic{width:var(--dock-icon-size);height:var(--dock-icon-size);border-radius:calc(var(--dock-icon-size)*.28);
  display:grid;place-items:center;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2);
  transition:width .28s,height .28s,border-radius .28s}
.dock-item .di-ic svg{width:58%;height:58%;display:block}
.dock-item:hover{transform:translateY(-6px) scale(1.06)}
.dock-item:active{transform:scale(.95)}
.dock-item.pressed{transform:scale(.94)}
.dock-item.running::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--text-dim)}
.dock-item.dragging{opacity:.45;transform:scale(.88)}
.dock-item.removing{opacity:.25;filter:grayscale(1);transform:scale(.75)}
.dock-item.dock-new{animation:dockIn .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes dockIn{0%{opacity:0;transform:scale(0) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.dock-item.dock-leaving{animation:dockOut .26s cubic-bezier(.4,0,.6,1) forwards;pointer-events:none}
@keyframes dockOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0)}}
.dock-item.menu-anchor .di-ic{filter:brightness(1.22) drop-shadow(0 0 8px rgba(255,255,255,.3))}
#home-indicator{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:134px;height:5px;border-radius:2.5px;
  background:var(--text-mute);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s,background .2s,width .25s;z-index:599}
#home-indicator.visible{opacity:1;pointer-events:auto}
#home-indicator:active{background:var(--text-dim);width:150px}

#launcher{position:absolute;inset:0;z-index:800;display:flex;flex-direction:column;align-items:center;padding:5vh 6vw;overflow:auto;
  background:rgba(8,8,14,.45);backdrop-filter:blur(44px) saturate(160%);-webkit-backdrop-filter:blur(44px) saturate(160%);
  opacity:0;pointer-events:none;transform:scale(1.05);transition:opacity .22s,transform .22s}
html[data-mode="light"] #launcher{background:rgba(240,240,248,.55)}
#launcher.open{opacity:1;pointer-events:auto;transform:scale(1)}
.launcher-search input{width:300px;max-width:70vw;height:38px;border-radius:11px;padding:0 16px;font-size:14px;outline:none;
  border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text);text-align:center}
.launcher-search input::placeholder{color:var(--text-mute)}
.launcher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:26px 12px;width:100%;max-width:880px;margin-top:38px}
.launcher-item{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;border:none;background:none;color:var(--text);touch-action:none}
.launcher-item .ic{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;border:1px solid var(--border-strong);
  box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .16s}
.launcher-item .ic svg{width:56%;height:56%;display:block}
.launcher-item:active .ic{transform:scale(.9)}
.launcher-item span{font-size:12px;opacity:.9}
.launcher-item.in-dock .ic,.launcher-item.on-desk .ic{box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2),0 0 0 2px var(--accent)}
.launcher-item.menu-anchor .ic{filter:brightness(1.2) drop-shadow(0 0 12px rgba(255,255,255,.4));transform:scale(1.06)}
.launcher-empty{color:var(--text-dim);font-size:14px;margin-top:40px}

.ctxmenu-popup{position:fixed;min-width:160px;padding:5px;border-radius:10px;background:var(--bg-menu);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border-strong);
  box-shadow:var(--shadow-menu);animation:menuIn .18s cubic-bezier(.22,1,.36,1);z-index:20000}
@keyframes menuIn{0%{opacity:0;transform:scale(.92) translateY(-4px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.ctx-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:6px;
  color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;gap:20px}
.ctx-item:hover{background:var(--bg-hover)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.disabled{opacity:.4;pointer-events:none}
.ctx-item .sub-arrow{opacity:.55;font-size:15px;line-height:1;margin-left:auto}
.ctx-sep{height:1px;background:var(--border);margin:4px 2px}

.modal-overlay{position:fixed;inset:0;z-index:25000;background:rgba(0,0,0,.42);
  display:flex;align-items:center;justify-content:center;padding:20px;animation:menuIn .18s ease}
.modal-box{min-width:280px;max-width:380px;width:100%;background:var(--bg-menu);
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid var(--border-strong);
  border-radius:14px;padding:18px 18px 14px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text)}
.modal-input{width:100%;height:36px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--bg-input);color:var(--text);padding:0 12px;font-size:13px;outline:none}
.modal-input:focus{border-color:var(--accent)}
.modal-msg{font-size:13px;line-height:1.6;color:var(--text-soft);margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
  background:var(--bg-menu);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;
  border:1px solid var(--border-strong);box-shadow:0 8px 24px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:26000;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mini-btn{padding:6px 14px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--text);
  border:1px solid var(--border-strong);background:var(--bg-input);transition:background .15s}
.mini-btn:hover{background:var(--bg-hover)}
.mini-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.mini-btn.primary:hover{background:var(--accent-hover)}
.mini-btn:disabled{opacity:.4;pointer-events:none}
.app-pad{padding:16px 18px 24px}
.app-h{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.app-h:not(:first-child){margin-top:22px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;
  border-radius:9px;background:var(--bg-fill);margin-bottom:6px;font-size:13px;color:var(--text-soft)}
.kv kbd{font-family:inherit;font-size:11.5px;padding:3px 8px;border-radius:6px;
  background:var(--bg-input);border:1px solid var(--border);white-space:nowrap}
.wp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px}
.wp-item{height:46px;border-radius:10px;border:2px solid transparent;cursor:pointer;padding:0;transition:border-color .15s,transform .15s}
.wp-item.active{border-color:var(--accent);transform:scale(1.04)}
.storage-wrap{padding:10px 12px;border-radius:10px;background:var(--bg-fill);margin-bottom:8px}
.storage-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px;color:var(--text-dim)}
.storage-label b{color:var(--text);font-weight:600}
.storage-bar{height:8px;border-radius:4px;background:var(--bg-input);overflow:hidden}
.storage-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),#5ac8fa);transition:width .4s}
.storage-bar-fill.warn{background:linear-gradient(90deg,var(--warn),#ff9f0a)}
.storage-bar-fill.danger{background:linear-gradient(90deg,var(--danger),#ff3b30)}
.storage-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:12px}
.storage-opt{padding:8px 4px;border-radius:8px;border:1.5px solid transparent;cursor:pointer;
  background:var(--bg-input);color:var(--text);font-size:12px;text-align:center}
.storage-opt.active{border-color:var(--accent);background:rgba(77,163,255,.18)}
.storage-hint{font-size:11.5px;color:var(--text-mute);line-height:1.6;margin-top:10px}
.storage-hint.warn{color:var(--warn)}

/* ===== 设置：侧栏 + 圆形按钮 ===== */
.st{display:flex;height:100%;min-height:0;background:var(--bg-toolbar);position:relative}
.st-side{flex:0 0 180px;display:flex;flex-direction:column;min-height:0;
  background:var(--bg-panel);border-right:1px solid var(--border);overflow-y:auto;
  transition:flex-basis .24s cubic-bezier(.32,.72,.34,1),opacity .2s ease;overflow-x:hidden}
.st-side.collapsed{flex-basis:0;opacity:0;border-right:none;pointer-events:none}
.st-side-head{padding:14px 16px;font-size:14px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap}
.st-group{padding:10px 8px 4px}
.st-group-title{padding:4px 8px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);white-space:nowrap}
.st-nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;
  border:none;background:none;color:var(--text-soft);font-size:13px;cursor:pointer;text-align:left;transition:background .12s;white-space:nowrap}
.st-nav:hover{background:var(--bg-hover)}
.st-nav.active{background:var(--accent);color:#fff}
.st-nav svg{width:16px;height:16px;flex:0 0 auto}
.st-content{flex:1;min-width:0;overflow-y:auto;position:relative;padding-top:46px}

/* 圆形按钮：收起时贴左上角，展开时贴侧栏右边缘；都在 padding-top 预留的 46px 区域内 */
.st-toggle{
  position:absolute;top:8px;left:8px;z-index:3;
  width:32px;height:32px;border-radius:50%;border:none;background:var(--bg-input);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  color:var(--text);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.18),inset 0 0 0 1px var(--border-strong);
  transition:background .18s,transform .18s cubic-bezier(.3,.7,.4,1.4),left .24s cubic-bezier(.32,.72,.34,1);
}
.st-toggle:hover{background:var(--bg-hover)}
.st-toggle:active{transform:scale(.9)}
.st-toggle svg{width:16px;height:16px;display:block}
/* 展开状态：按钮固定在侧栏右边缘内侧 8px 处，与侧栏边缘对齐 */
.st-toggle.on-side{left:156px}
.st-toggle .icon-open,.st-toggle .icon-close{position:absolute;transition:opacity .18s,transform .24s cubic-bezier(.3,.7,.4,1.3)}
.st-toggle .icon-close{opacity:0;transform:rotate(-90deg) scale(.6)}
.st-toggle.on-side .icon-open{opacity:0;transform:rotate(90deg) scale(.6)}
.st-toggle.on-side .icon-close{opacity:1;transform:rotate(0) scale(1)}

.st-pane{display:none;padding:0 22px 24px}
.st-pane.active{display:block}
.st-pane h2{font-size:16px;font-weight:700;margin:0 0 18px;color:var(--text)}
.st-pane h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin:18px 0 10px}
.st-pane section:first-of-type h3{margin-top:0}
.st-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-soft)}
.st-row:last-child{border-bottom:none}
.st-row .lbl{flex:1;min-width:0}
.st-row .hint{font-size:11px;color:var(--text-mute);margin-top:2px;line-height:1.5}
.st-row .ctrl{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.st-slider{width:130px;height:4px;border-radius:2px;background:var(--bg-input);outline:none;-webkit-appearance:none;appearance:none}
.st-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.st-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:none}
.st-slider-val{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:12px;min-width:48px;text-align:right}
.st-switch{position:relative;width:34px;height:20px;flex:0 0 auto;display:inline-block}
.st-switch input{opacity:0;width:0;height:0;position:absolute}
.st-switch .track{position:absolute;inset:0;background:var(--bg-input);border-radius:999px;transition:background .16s}
.st-switch .track::before{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.st-switch input:checked + .track{background:var(--accent)}
.st-switch input:checked + .track::before{transform:translateX(14px)}
.st-select{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text);font-size:12px;outline:none}
.st-seg{display:inline-flex;background:var(--bg-input);border-radius:9px;padding:2px;gap:2px}
.st-seg button{padding:5px 12px;border:none;background:none;color:var(--text-dim);font-size:12px;border-radius:7px;cursor:pointer;transition:background .12s,color .12s}
.st-seg button.active{background:var(--accent);color:#fff}
.st-about{font-size:13px;line-height:1.75;color:var(--text-soft)}

/* ===== 文件 ===== */
.fm{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg-toolbar)}
.fm-toolbar{display:flex;align-items:center;gap:5px;padding:8px 10px;flex:0 0 auto;border-bottom:1px solid var(--border)}
.fm-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg-input);color:var(--text);cursor:pointer;
  font-size:15px;display:grid;place-items:center;flex:0 0 auto;transition:background .12s}
.fm-btn:hover{background:var(--bg-hover)}
.fm-btn:disabled{opacity:.35;pointer-events:none}
.fm-path{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;
  font-size:12.5px;color:var(--text-dim);white-space:nowrap;padding:0 8px;scrollbar-width:none}
.fm-path::-webkit-scrollbar{display:none}
.fm-crumb{padding:3px 6px;border-radius:5px;cursor:pointer;flex:0 0 auto;transition:background .12s}
.fm-crumb:hover{background:var(--bg-hover)}
.fm-sep{opacity:.4;flex:0 0 auto}
.fm-search{width:100px;height:28px;border-radius:7px;border:1px solid var(--border-strong);
  background:var(--bg-input);color:var(--text);padding:0 8px;font-size:12px;outline:none;transition:width .2s}
.fm-search:focus{width:160px;border-color:var(--accent)}
.fm-main{flex:1;overflow-y:auto;min-height:0;position:relative}
.fm-list{padding:10px;min-height:100%}
.fm-list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:4px;align-content:start}
.fm-list.list{display:block}
.fm-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;
  border-radius:10px;cursor:pointer;transition:background .12s;min-width:0;position:relative;touch-action:manipulation}
.fm-item:hover{background:var(--bg-hover)}
.fm-item:active{background:var(--bg-hover);filter:brightness(1.08)}
.fm-item.selected{background:rgba(77,163,255,.25);outline:1.5px solid var(--accent)}
.fm-item .fm-ic{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center}
.fm-item .fm-ic svg{width:100%;height:100%;display:block}
.fm-item .fm-name{font-size:11px;line-height:1.3;color:var(--text-soft);text-align:center;word-break:break-all;
  max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fm-list.list .fm-item{flex-direction:row;justify-content:flex-start;padding:8px 12px;gap:12px}
.fm-list.list .fm-ic{width:24px;height:24px}
.fm-list.list .fm-name{font-size:13px;text-align:left;flex:1;-webkit-line-clamp:1;word-break:break-word}
.fm-list.list .fm-meta{font-size:11.5px;color:var(--text-mute);flex:0 0 auto;display:flex;gap:14px;font-variant-numeric:tabular-nums}
.fm-empty{grid-column:1/-1;text-align:center;color:var(--text-mute);padding:50px 20px;font-size:13px;line-height:1.9;pointer-events:none}
.fm-selection-bar{display:none;align-items:center;gap:8px;padding:8px 12px;flex:0 0 auto;
  background:rgba(77,163,255,.18);border-bottom:1px solid rgba(77,163,255,.3);font-size:12.5px}
.fm-selection-bar.on{display:flex}
.fm-selection-bar .grow{flex:1}
.fm-drop-hint{
  position:absolute;inset:8px;border-radius:12px;pointer-events:none;z-index:4;
  background:rgba(77,163,255,.12);border:2px dashed var(--accent);
  display:none;align-items:center;justify-content:center;color:var(--accent);
  font-size:14px;font-weight:600;
}
.fm-main.drag-over .fm-drop-hint{display:flex}

.editor{display:flex;flex-direction:column;height:100%;min-height:0}
.editor-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;flex:0 0 auto;border-bottom:1px solid var(--border)}
.editor-path{font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor-body{flex:1;border:none;outline:none;resize:none;background:transparent;color:var(--text);
  font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.65;padding:12px 14px}
.iviewer{height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-toolbar);padding:10px}
.iviewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}

.calc{display:flex;flex-direction:column;height:100%;padding:10px;gap:10px}
.calc-disp{flex:0 0 auto;text-align:right;font-size:42px;font-weight:300;letter-spacing:-.02em;padding:10px 12px 6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-variant-numeric:tabular-nums}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:7px}
.calc-keys button{border:none;border-radius:11px;font-size:19px;cursor:pointer;color:var(--text);
  background:var(--bg-input);transition:background .12s,transform .08s;font-variant-numeric:tabular-nums}
.calc-keys button:active{transform:scale(.95);background:var(--bg-hover)}
.calc-keys .fn{background:var(--bg-hover)}
.calc-keys .op{background:#ff9f0a;color:#fff}
.calc-keys .op:active{background:#ffb340}
.calc-keys .eq{background:#ff9f0a;color:#fff}
.calc-keys .span2{grid-column:span 2}

.notes{display:flex;height:100%;min-height:0}
.notes-side{flex:0 0 160px;display:flex;flex-direction:column;min-height:0;background:var(--bg-panel);border-right:1px solid var(--border)}
.notes-head{padding:9px;flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.notes-head .row{display:flex;gap:6px}
.notes-head .mini-btn{flex:1;padding:5px 8px;font-size:11.5px}
.notes-list{flex:1;overflow-y:auto;padding:0 7px 10px}
.note-item{display:flex;gap:8px;width:100%;text-align:left;border:none;cursor:pointer;padding:8px 9px;margin-bottom:5px;
  border-radius:8px;background:var(--bg-fill);color:var(--text);align-items:center}
.note-item.active{background:rgba(255,159,10,.85);color:#fff}
.note-item .ni-thumb{width:32px;height:32px;border-radius:6px;flex:0 0 auto;background:var(--bg-input);display:grid;place-items:center;overflow:hidden}
.note-item .ni-thumb svg{width:18px;height:18px;color:var(--text-dim)}
.note-item .ni-thumb img{width:100%;height:100%;object-fit:cover}
.note-item .ni-body{flex:1;min-width:0}
.note-item .ni-title{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item .ni-sub{font-size:11px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.notes-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.note-title{flex:0 0 auto;border:none;outline:none;background:none;color:var(--text);font-size:16px;font-weight:600;padding:12px 14px 6px}
.note-body{flex:1;border:none;outline:none;resize:none;background:none;color:var(--text-soft);font-size:13.5px;line-height:1.65;padding:6px 14px 14px}
.notes-draw{flex:1;display:none;flex-direction:column;min-height:0;background:var(--bg-toolbar)}
.notes-draw.on{display:flex}
.note-body.hide{display:none}
.note-title.hide{display:none}
.draw-toolbar{display:flex;align-items:center;gap:6px;padding:8px;flex:0 0 auto;border-bottom:1px solid var(--border);flex-wrap:wrap}
.draw-toolbar .mini-btn{padding:5px 9px;font-size:11.5px}
.draw-color{width:26px;height:26px;border-radius:6px;border:1px solid var(--border-strong);padding:0;cursor:pointer;background:none}
.draw-color.active{outline:2px solid var(--accent);outline-offset:1px}
.draw-size{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim)}
.draw-size input{width:60px}
.draw-canvas-wrap{flex:1;position:relative;min-height:0;background:#fff}
.draw-canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.draw-status{padding:5px 12px;font-size:11px;color:var(--text-mute);background:var(--bg-fill);text-align:center;flex:0 0 auto}

.clock{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px}
.clock-ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#5ac8fa 0deg,rgba(128,128,128,.1) 0deg);transition:background .2s linear}
.clock-ring-inner{width:98px;height:98px;border-radius:50%;background:var(--bg-panel);
  display:grid;place-items:center;font-size:13px;color:var(--text-dim)}
.clock-time{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;color:var(--text);text-shadow:0 4px 20px rgba(0,0,0,.1)}
.clock-date{font-size:13px;color:var(--text-dim)}

.br{display:flex;flex-direction:column;height:100%;min-height:0}
.br-bar{display:flex;align-items:center;gap:6px;padding:8px;flex:0 0 auto;border-bottom:1px solid var(--border)}
.br-bar button{width:30px;height:30px;border-radius:9px;border:none;background:var(--bg-input);color:var(--text);
  cursor:pointer;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.br-bar button:hover{background:var(--bg-hover)}
.br-url{flex:1;height:30px;border-radius:9px;border:1px solid var(--border-strong);background:var(--bg-input);
  color:var(--text);padding:0 10px;font-size:12.5px;outline:none}
.br-url::placeholder{color:var(--text-mute)}
.br-view{flex:1;position:relative;min-height:0;background:var(--bg-toolbar)}
.br-frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;display:none}
.br-home{position:absolute;inset:0;overflow:auto;padding:16px}
.br-tip{font-size:12px;color:var(--text-mute);margin-bottom:14px;line-height:1.6}
.br-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.br-card{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;border-radius:13px;
  border:1px solid var(--border);background:var(--bg-fill);color:var(--text);cursor:pointer;font-size:12.5px}
.br-card:hover{background:var(--bg-hover)}
.br-card-ic{font-size:22px}

@supports (corner-shape:squircle){
  .window,.desk-icon .ic,.dock-item .di-ic,#dock,.ctxmenu-popup,.launcher-item .ic,
  .launcher-search input,.calc-keys button,.mini-btn,.wp-item,.note-item,.br-bar button,
  .br-url,.br-card,.tl,.win-resize::after,.traffic.expanded,#home-indicator,
  .fm-item,.fm-btn,.toast,.iviewer img,.storage-opt,.storage-bar,.modal-box,.modal-input,
  .st-nav,.st-toggle,.st-slider,.draw-color{corner-shape:squircle}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

  <div class="boot-stage">

      <span class="bp bp-ver-wrap"><span class="bp-ver">ver</span></span>
      <span class="bp-gap" id="bootGap"><span class="bp-version" id="bootVersion">1.8.1</span></span>
      <span class="bp bp-swap-wrap"><span class="bp-se">se</span><span class="bp-os">OS</span></span>
    </div>
  </div>
</div>

<div id="statusbar">
  <div class="sb-left">
    <div class="sb-apple">●</div>
    <div class="sb-appname" id="sbAppName">Universe</div>
    <div class="sb-menus">
      <span class="sb-menu-item">文件</span>
      <span class="sb-menu-item">编辑</span>
      <span class="sb-menu-item">显示</span>
      <span class="sb-menu-item">窗口</span>
      <span class="sb-menu-item">帮助</span>
    </div>
  </div>

/* ============================================================
   FS — 统一接口（OPFS / 内存降级）
   ============================================================ */
const FS = (() => {
  let backend = null, backendPromise = null, rootPromise = null;
  const memFS = new Map();

  async function detect() {
    if (backend) return backend;
    if (backendPromise) return backendPromise;
    backendPromise = (async () => {
      try {
        if (navigator.storage && navigator.storage.getDirectory) {
          await navigator.storage.getDirectory();
          backend = 'opfs'; return backend;
        }
      } catch (e) {}
      backend = 'memory'; return backend;
    })();
    return backendPromise;
  }
  async function getRoot() { if (!rootPromise) rootPromise = navigator.storage.getDirectory(); return rootPromise; }
  async function opfsDirOf(path, create) {
    const parts = path.split('/').filter(Boolean);
    const name = parts.pop();
    let dir = await getRoot();
    for (const seg of parts) dir = await dir.getDirectoryHandle(seg, { create });
    return { dir, name };
  }
  function memEnsureDirs(parts) { let cur = ''; for (const p of parts) { cur = cur ? cur + '/' + p : p; if (!memFS.has(cur)) memFS.set(cur, { type: 'dir' }); } }

  const api = {
    async backend() { return await detect(); },
    async write(path, data) {
      const be = await detect();
      const delta = await api._delta(path, data);
      if (delta > 0 && !(await StorageQuota.canGrow(delta))) throw new Error('存储空间不足');
      if (be === 'opfs') {
        const { dir, name } = await opfsDirOf(path, true);
        const fh = await dir.getFileHandle(name, { create: true });
        const w = await fh.createWritable(); await w.write(data); await w.close();
      } else {
        const parts = path.split('/').filter(Boolean); parts.pop(); memEnsureDirs(parts);
        const blob = data instanceof Blob ? data : new Blob([data]);
        memFS.set(path, { type: 'file', blob, size: blob.size, lastModified: Date.now() });
      }
      StorageQuota.invalidate(); return true;
    },
    async read(path) {
      const be = await detect();
      if (be === 'opfs') { const { dir, name } = await opfsDirOf(path, false); const fh = await dir.getFileHandle(name); return await (await fh.getFile()).text(); }
      const e = memFS.get(path); if (!e || e.type !== 'file') throw new Error('文件不存在'); return await e.blob.text();
    },
    async readBlob(path) {
      const be = await detect();
      if (be === 'opfs') { const { dir, name } = await opfsDirOf(path, false); const fh = await dir.getFileHandle(name); return await fh.getFile(); }
      const e = memFS.get(path); if (!e || e.type !== 'file') throw new Error('文件不存在'); return e.blob;
    },
    async remove(path) {
      const be = await detect();
      if (be === 'opfs') { const { dir, name } = await opfsDirOf(path, false); await dir.removeEntry(name, { recursive: true }); }
      else { memFS.delete(path); const p = path + '/'; for (const k of Array.from(memFS.keys())) if (k.startsWith(p)) memFS.delete(k); }
      StorageQuota.invalidate();
    },
    async mkdir(path) {
      const be = await detect();
      if (be === 'opfs') { const { dir, name } = await opfsDirOf(path, true); await dir.getDirectoryHandle(name, { create: true }); }
      else memEnsureDirs(path.split('/').filter(Boolean));
    },
    async rename(o, n) { const b = await api.readBlob(o); await api.write(n, b); await api.remove(o); },
    async list(path = '') {
      const be = await detect();
      if (be === 'opfs') {
        const dir = path ? (await opfsDirOf(path + '/_', false)).dir : await getRoot();
        const out = [];
        for await (const [name, h] of dir.entries()) {
          const it = { name, kind: h.kind };
          if (h.kind === 'file') { try { const f = await h.getFile(); it.size = f.size; it.lastModified = f.lastModified; } catch (_) {} }
          out.push(it);
        }
        return out;
      }
      const prefix = path ? path + '/' : '', out = [], seen = new Set();
      for (const [p, v] of memFS) {
        if (prefix && !p.startsWith(prefix)) continue;
        const rel = p.slice(prefix.length); if (!rel || rel.includes('/') || seen.has(rel)) continue;
        seen.add(rel);
        if (v.type === 'file') out.push({ name: rel, kind: 'file', size: v.size || 0, lastModified: v.lastModified || 0 });
        else out.push({ name: rel, kind: 'directory' });
      }
      return out;
    },
    async persist() {
      const be = await detect(); if (be !== 'opfs') return false;
      if (!navigator.storage.persist) return false;
      if (await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    },
    async usage() {
      const be = await detect();
      if (be === 'opfs') { const e = await navigator.storage.estimate(); return { used: e.usage || 0, quota: e.quota || 0 }; }
      let used = 0; for (const v of memFS.values()) if (v.type === 'file' && v.blob) used += v.blob.size;
      return { used, quota: 10 * 1024 * 1024 * 1024 };
    },
    async _delta(path, data) {
      let n = 0;
      if (typeof data === 'string') n = new Blob([data]).size;
      else if (data instanceof Blob) n = data.size;
      else if (data instanceof ArrayBuffer) n = data.byteLength;
      let o = 0; try { const b = await api.readBlob(path); o = b.size; } catch (_) {}
      return Math.max(0, n - o);
    }
  };
  return api;
})();
document.addEventListener('pointerdown', function () { FS.persist().catch(() => {}); }, { once: true });

const StorageQuota = (() => {
  const DEF = 512 * 1024 * 1024;
  let cached = null, t = 0;
  function getLimit() { return Store.get('storage.limit', DEF); }
  function setLimit(n) { Store.set('storage.limit', n); invalidate(); }
  function invalidate() { cached = null; t = 0; }
  async function getUsage() {
    const now = Date.now();
    if (cached != null && now - t < 3000) return cached;
    try { const { used } = await FS.usage(); cached = used; t = now; return used; } catch (_) { return 0; }
  }
  async function canGrow(b) { const u = await getUsage(); return u + b <= getLimit(); }
  return { getLimit, setLimit, getUsage, canGrow, invalidate };
})();

function formatSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

    document.body.appendChild(o);

    setTimeout(() => { inp.focus(); inp.select(); }, 60);
    const close = v => { o.remove(); res(v); };
    o.querySelector('[data-o]').onclick = () => close(inp.value.trim());
    o.querySelector('[data-c]').onclick = () => close(null);
    o.addEventListener('pointerdown', e => { if (e.target === o) close(null); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); close(inp.value.trim()); }
      if (e.key === 'Escape') { e.preventDefault(); close(null); }
    });
  });
}
function confirmDialog(title) {
  return new Promise(res => {

    o.querySelector('[data-c]').onclick = () => close(false);
    o.addEventListener('pointerdown', e => { if (e.target === o) close(false); });
  });
}

const TAP_DELAY = 380, DOUBLE_GAP = 300;
function bindTap(el, { onSingle, onDouble, isDragging } = {}) {
  let tapTimer = null, lastTapAt = 0, downAt = 0, startP = null, moved = false;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    downAt = Date.now(); moved = false; startP = { x: e.clientX, y: e.clientY };
  });
  el.addEventListener('pointermove', e => {
    if (!startP) return;
    if (Math.hypot(e.clientX - startP.x, e.clientY - startP.y) > 8) {
      moved = true; clearTimeout(tapTimer); tapTimer = null; lastTapAt = 0;
    }
  });
  el.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!startP) return;
    startP = null;
    if (moved) return;
    if (isDragging && isDragging()) return;
    const now = Date.now();
    if (lastTapAt && now - lastTapAt < DOUBLE_GAP) {
      clearTimeout(tapTimer); tapTimer = null; lastTapAt = 0;
      suppressClicks();
      onDouble && onDouble(e);
    } else {
      lastTapAt = now;
      clearTimeout(tapTimer);
      if (onSingle) {
        tapTimer = setTimeout(() => {
          tapTimer = null;
          if (Date.now() - lastTapAt >= DOUBLE_GAP - 20) { lastTapAt = 0; onSingle(e); }
        }, TAP_DELAY);
      } else {
        tapTimer = setTimeout(() => { tapTimer = null; lastTapAt = 0; }, TAP_DELAY);
      }
    }
  });
  el.addEventListener('pointercancel', () => { clearTimeout(tapTimer); tapTimer = null; lastTapAt = 0; startP = null; });
}

function fileIconSvg(name, kind) {
  if (kind === 'directory') {
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 10a3 3 0 0 1 3-3h8l3 3h15a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#4da3ff"/>
      <path d="M4 14h32v13a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#6db5ff"/>
    </svg>`;
  }
  const ext = name.split('.').pop().toLowerCase();
  const wrap = (inner, color) => `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 4h14l10 10v22a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="${color}"/>
    <path d="M24 4v10h10" fill="rgba(255,255,255,.35)"/>
    ${inner}</svg>`;
  if (['png','jpg','jpeg','gif','webp','svg','bmp','ico'].includes(ext))
    return wrap(`<circle cx="17" cy="21" r="3" fill="#fff"/><path d="M10 32l7-8 5 5 3-3 6 6z" fill="#fff" opacity=".85"/>`, '#22c55e');
  if (['mp4','mov','webm','avi','mkv'].includes(ext))
    return wrap(`<path d="M16 19l9 5-9 5z" fill="#fff"/>`, '#ef4444');
  if (['mp3','wav','ogg','m4a','flac'].includes(ext))
    return wrap(`<circle cx="20" cy="26" r="3" fill="#fff"/><path d="M22 26V18l6-2v8" stroke="#fff" stroke-width="1.7" fill="none"/><circle cx="25" cy="24" r="3" fill="#fff"/>`, '#a855f7');
  if (['zip','rar','7z','tar','gz'].includes(ext))
    return wrap(`<path d="M20 12v16M17 15h6M17 19h6M17 23h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>`, '#eab308');
  if (['js','ts','json','html','css','xml','yaml','yml','py','go','rs','c','cpp','sh'].includes(ext))
    return wrap(`<text x="20" y="29" font-family="monospace" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">&lt;/&gt;</text>`, '#3b82f6');
  if (['pdf'].includes(ext))
    return wrap(`<text x="20" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>`, '#dc2626');
  if (['md','txt','log'].includes(ext))
    return wrap(`<path d="M14 18h12M14 22h12M14 26h8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>`, '#64748b');
  return wrap(`<path d="M14 18h12M14 22h12M14 26h8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>`, '#94a3b8');
}

    <div class="st-row"><div class="lbl">切换窗口</div><div class="ctrl"><kbd style="padding:2px 6px;background:var(--bg-input);border-radius:4px;font-size:11px">Alt + Tab</kbd></div></div>
    <div class="st-row"><div class="lbl">关闭窗口</div><div class="ctrl"><kbd style="padding:2px 6px;background:var(--bg-input);border-radius:4px;font-size:11px">Alt + Q</kbd></div></div>`;

  });
}

/* ============================================================
   文件应用
   ============================================================ */
async function buildFiles(body) {
  let cwd = '';
  let view = Store.get('files.view', 'grid');
  let sortKey = 'name', sortDir = 1;
  let selecting = false, selection = new Set();
  let clipboard = null, query = '';
  let history = [''], historyIdx = 0;

  body.innerHTML = `
    <div class="fm">
      <div class="fm-toolbar">
        <button class="fm-btn" data-act="back">‹</button>
        <button class="fm-btn" data-act="forward">›</button>
        <button class="fm-btn" data-act="home">⌂</button>
        <div class="fm-path" data-path></div>
        <input class="fm-search" data-search placeholder="搜索">
        <button class="fm-btn" data-act="import" title="从电脑导入文件">📥</button>
        <button class="fm-btn" data-act="view">${view === 'grid' ? '☰' : '▦'}</button>
        <button class="fm-btn" data-act="new">＋</button>
        <button class="fm-btn" data-act="refresh">⟳</button>
      </div>
      <div class="fm-selection-bar" data-selection-bar>
        <span data-sel-count>已选 0 项</span><span class="grow"></span>
        <button class="mini-btn" data-sel-all>全选</button>
        <button class="mini-btn" data-sel-delete>删除</button>
        <button class="mini-btn" data-sel-cancel>取消</button>
      </div>
      <div class="fm-main"><div class="fm-list ${view}" data-list></div>
        <div class="fm-drop-hint">松开以导入到当前文件夹</div>
      </div>
      <input type="file" data-file-input multiple hidden>
    </div>`;

  const $path = body.querySelector('[data-path]');
  const $list = body.querySelector('[data-list]');
  const $main = body.querySelector('.fm-main');
  const $search = body.querySelector('[data-search]');
  const $back = body.querySelector('[data-act="back"]');
  const $forward = body.querySelector('[data-act="forward"]');
  const $viewBtn = body.querySelector('[data-act="view"]');
  const $selBar = body.querySelector('[data-selection-bar]');
  const $selCount = body.querySelector('[data-sel-count]');
  const $fileInput = body.querySelector('[data-file-input]');

  const joinPath = (b, n) => b ? b + '/' + n : n;

  /* ---------- 路径 UI ---------- */
  function updatePathUI() {
    $path.innerHTML = '';
    const r = document.createElement('span');
    r.className = 'fm-crumb'; r.textContent = 'Universe';
    r.onclick = () => navigateTo('');
    $path.appendChild(r);
    const parts = cwd ? cwd.split('/') : [];
    parts.forEach((p, i) => {
      const sep = document.createElement('span'); sep.className = 'fm-sep'; sep.textContent = '/';
      $path.appendChild(sep);
      const c = document.createElement('span'); c.className = 'fm-crumb'; c.textContent = p;
      const target = parts.slice(0, i + 1).join('/');
      c.onclick = () => navigateTo(target);
      $path.appendChild(c);
    });
    $back.disabled = historyIdx <= 0;
    $forward.disabled = historyIdx >= history.length - 1;
  }

  function navigateTo(path, push = true) {
    cwd = path || '';
    if (push) { history = history.slice(0, historyIdx + 1); history.push(cwd); historyIdx = history.length - 1; }
    selection.clear(); selecting = false; updateSelectionBar(); refresh();
  }

  function updateSelectionBar() {
    $selBar.classList.toggle('on', selecting);
    $selCount.textContent = '已选 ' + selection.size + ' 项';
  }

  /* ---------- 刷新 ---------- */
  async function refresh() {
    try {
      let entries = await FS.list(cwd);
      const showHidden = Store.get('files.showHidden', false);
      if (!showHidden) entries = entries.filter(e => !e.name.startsWith('.'));
      if (query) { const q = query.toLowerCase(); entries = entries.filter(e => e.name.toLowerCase().includes(q)); }
      entries.sort((a, b) => {
        if (a.kind !== b.kind) return a.kind === 'directory' ? -1 : 1;
        let av, bv;
        if (sortKey === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
        else if (sortKey === 'size') { av = a.size || 0; bv = b.size || 0; }
        else if (sortKey === 'time') { av = a.lastModified || 0; bv = b.lastModified || 0; }
        else { av = a.name.split('.').pop(); bv = b.name.split('.').pop(); }
        if (av < bv) return -sortDir; if (av > bv) return sortDir; return 0;
      });

      $list.innerHTML = ''; $list.className = 'fm-list ' + view;
      if (!entries.length) {
        $list.innerHTML = `<div class="fm-empty">${query ? '没有匹配的文件' : '此文件夹为空<br>双击空白处可新建，或点 📥 导入文件'}</div>`;
        updatePathUI(); return;
      }

      entries.forEach(e => {
        const path = joinPath(cwd, e.name);
        const el = document.createElement('div');
        el.className = 'fm-item' + (selection.has(path) ? ' selected' : '');
        el.dataset.path = path;
        el.innerHTML = `<div class="fm-ic">${fileIconSvg(e.name, e.kind)}</div>
          <div class="fm-name">${escapeHtml(e.name)}</div>
          ${view === 'list' ? `<div class="fm-meta"><span>${e.size != null ? formatSize(e.size) : '—'}</span><span>${e.lastModified ? new Date(e.lastModified).toLocaleDateString() : '—'}</span></div>` : ''}`;

        bindTap(el, {
          onSingle: () => {
            if (selecting) {
              if (selection.has(path)) selection.delete(path); else selection.add(path);
              el.classList.toggle('selected'); updateSelectionBar(); return;
            }
            if (e.kind === 'directory') navigateTo(path);
            else openFile(path);
          },
          onDouble: (ev) => showFileMenu(ev.clientX, ev.clientY, e, path)
        });

        $list.appendChild(el);
      });
      updatePathUI();
    } catch (err) { $list.innerHTML = `<div class="fm-empty">读取失败：${escapeHtml(err.message)}</div>`; }
  }

  function openFile(path) {
    const ext = path.split('.').pop().toLowerCase();
    if (['png','jpg','jpeg','gif','webp','svg','bmp','ico'].includes(ext)) openApp('imageviewer', { path });
    else openApp('texteditor', { path });
  }

  /* ---------- 导入 ---------- */
  async function importFiles(fileList) {
    if (!fileList || !fileList.length) return;
    let ok = 0, fail = 0;
    for (const file of fileList) {
      try {
        let name = file.name;
        // 如果当前目录已有同名，加后缀
        const existing = await FS.list(cwd);
        if (existing.some(e => e.name === name)) {
          const base = name.replace(/\.[^.]+$/, '');
          const ext = name.includes('.') ? name.slice(name.lastIndexOf('.')) : '';
          let i = 1;
          while (existing.some(e => e.name === base + ' (' + i + ')' + ext)) i++;
          name = base + ' (' + i + ')' + ext;
        }
        await FS.write(joinPath(cwd, name), file);
        ok++;
      } catch (err) { fail++; }
    }
    if (ok) toast(`已导入 ${ok} 个文件` + (fail ? `，${fail} 个失败` : ''));
    else toast('导入失败');
    refresh();
  }

  body.querySelector('[data-act="import"]').onclick = () => $fileInput.click();
  $fileInput.onchange = () => { importFiles($fileInput.files); $fileInput.value = ''; };

  /* ---------- 拖拽导入 ---------- */
  let dragDepth = 0;
  $main.addEventListener('dragenter', e => {
    e.preventDefault();
    dragDepth++;
    $main.classList.add('drag-over');
  });
  $main.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  $main.addEventListener('dragleave', e => {
    dragDepth--;
    if (dragDepth <= 0) { dragDepth = 0; $main.classList.remove('drag-over'); }
  });
  $main.addEventListener('drop', async e => {
    e.preventDefault();
    dragDepth = 0;
    $main.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    if (files && files.length) importFiles(files);
  });

  /* ---------- 菜单 ---------- */
  function showFileMenu(x, y, entry, path) {
    const isDir = entry.kind === 'directory';
    const ext = entry.name.split('.').pop().toLowerCase();
    const items = [];
    if (isDir) items.push({ label: '打开', action: () => navigateTo(path) });
    else {
      const openSubs = [{ label: '文本编辑器', action: () => openApp('texteditor', { path }) }];
      if (['png','jpg','jpeg','gif','webp','svg','bmp','ico'].includes(ext)) openSubs.unshift({ label: '图片查看器', action: () => openApp('imageviewer', { path }) });
      items.push({ label: '打开', children: openSubs });
      items.push({ label: '导出到本地', action: async () => {
        try {
          const blob = await FS.readBlob(path);
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = entry.name;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          toast('已导出');
        } catch (err) { toast('导出失败：' + err.message); }
      }});
    }
    items.push({ label: '重命名', action: () => renameEntry(path, entry.name) });
    items.push({ label: '复制', action: () => { clipboard = { path, mode: 'copy', name: entry.name }; toast('已复制'); } });
    items.push({ label: '剪切', action: () => { clipboard = { path, mode: 'cut', name: entry.name }; toast('已剪切'); } });
    items.push({ label: '删除', danger: true, action: async () => {
      if (!(await confirmDialog(`删除「${entry.name}」？`))) return;
      try { await FS.remove(path); toast('已删除'); refresh(); } catch (err) { toast('删除失败：' + err.message); }
    }});
    items.push({ sep: true });
    items.push({ label: '复制路径', action: () => { navigator.clipboard?.writeText('/' + path).catch(() => {}); toast('路径已复制'); } });
    items.push({ label: '属性', action: () => {
      const size = entry.size != null ? formatSize(entry.size) : '—';
      const m = entry.lastModified ? new Date(entry.lastModified).toLocaleString() : '—';
      toast(`${entry.name}\n${size} · ${m}`, 3000);
    }});
    items.push({ sep: true });
    items.push({ label: '选择', action: () => { selecting = true; selection.add(path); updateSelectionBar(); refresh(); } });
    showMenu(x, y, items);
  }

  function showBlankMenu(x, y) {
    showMenu(x, y, [
      { label: '新建', children: [
        { label: '文件夹', action: () => createFolder() },
        { label: '文本文件 (.txt)', action: () => createFile('txt') },
        { label: 'Markdown (.md)', action: () => createFile('md') },
        { label: 'HTML 文件', action: () => createFile('html') },
        { label: 'JSON 文件', action: () => createFile('json') },
        { label: 'JavaScript', action: () => createFile('js') },
        { label: 'CSS', action: () => createFile('css') },
        { label: 'SVG', action: () => createFile('svg') }
      ] },
      { label: '导入文件…', action: () => $fileInput.click() },
      { label: clipboard ? `粘贴「${clipboard.name}」` : '粘贴', disabled: !clipboard, action: () => pasteClipboard() },
      { sep: true },
      { label: '排序', children: [
        { label: (sortKey === 'name' ? '✓ ' : '') + '名称', action: () => { sortKey = 'name'; sortDir = 1; refresh(); } },
        { label: (sortKey === 'size' ? '✓ ' : '') + '大小', action: () => { sortKey = 'size'; sortDir = 1; refresh(); } },
        { label: (sortKey === 'type' ? '✓ ' : '') + '类型', action: () => { sortKey = 'type'; sortDir = 1; refresh(); } },
        { label: (sortKey === 'time' ? '✓ ' : '') + '修改时间', action: () => { sortKey = 'time'; sortDir = -1; refresh(); } }
      ] },
      { label: '视图', children: [
        { label: (view === 'grid' ? '✓ ' : '') + '网格', action: () => setView('grid') },
        { label: (view === 'list' ? '✓ ' : '') + '列表', action: () => setView('list') }
      ] },
      { label: '全选', action: () => selectAll() },
      { label: '刷新', action: refresh }
    ]);
  }

  function setView(v) { view = v; Store.set('files.view', v); $viewBtn.textContent = v === 'grid' ? '☰' : '▦'; refresh(); }
  function selectAll() { selecting = true; $$('.fm-item', $list).forEach(el => { selection.add(el.dataset.path); el.classList.add('selected'); }); updateSelectionBar(); }

  async function createFolder() {
    const name = await promptDialog('文件夹名称', '新建文件夹');
    if (!name) return;
    try { await FS.mkdir(joinPath(cwd, name)); toast('已创建'); refresh(); }
    catch (err) { toast('创建失败：' + err.message); }
  }
  async function createFile(ext) {
    const name = await promptDialog('文件名', `新文件.${ext}`);
    if (!name) return;
    try {
      const content = FILE_TEMPLATES[ext] || '';
      await FS.write(joinPath(cwd, name), content);
      toast('已创建'); refresh();
    } catch (err) { toast('创建失败：' + err.message); }
  }
  async function renameEntry(oldPath, oldName) {
    const name = await promptDialog('重命名', oldName);
    if (!name || name === oldName) return;
    try { await FS.rename(oldPath, joinPath(cwd, name)); toast('已重命名'); refresh(); }
    catch (err) { toast('重命名失败：' + err.message); }
  }
  async function pasteClipboard() {
    if (!clipboard) return;
    try {
      const target = joinPath(cwd, clipboard.name);
      if (clipboard.mode === 'copy') { const blob = await FS.readBlob(clipboard.path); await FS.write(target, blob); }
      else { await FS.rename(clipboard.path, target); clipboard = null; }
      toast('已粘贴'); refresh();
    } catch (err) { toast('粘贴失败：' + err.message); }
  }
  async function deleteSelected() {
    if (!selection.size) return;
    if (!(await confirmDialog(`删除 ${selection.size} 项？`))) return;
    for (const p of Array.from(selection)) { try { await FS.remove(p); } catch (_) {} }
    selection.clear(); selecting = false; updateSelectionBar(); toast('已删除'); refresh();
  }

  $back.onclick = () => { if (historyIdx > 0) { historyIdx--; navigateTo(history[historyIdx], false); } };
  $forward.onclick = () => { if (historyIdx < history.length - 1) { historyIdx++; navigateTo(history[historyIdx], false); } };
  body.querySelector('[data-act="home"]').onclick = () => navigateTo('');
  body.querySelector('[data-act="refresh"]').onclick = refresh;
  body.querySelector('[data-act="new"]').onclick = () => createFolder();
  $viewBtn.onclick = () => setView(view === 'grid' ? 'list' : 'grid');
  $search.oninput = () => { query = $search.value; refresh(); };

  body.querySelector('[data-sel-all]').onclick = selectAll;
  body.querySelector('[data-sel-delete]').onclick = deleteSelected;
  body.querySelector('[data-sel-cancel]').onclick = () => { selection.clear(); selecting = false; updateSelectionBar(); refresh(); };

  let blankLastTap = 0, blankTimer = null;
  $main.addEventListener('pointerup', (e) => {
    if (e.target.closest('.fm-item')) return;
    if (e.target.closest('.fm-toolbar')) return;
    if (e.target.closest('.fm-selection-bar')) return;
    const now = Date.now();
    if (blankLastTap && now - blankLastTap < 300) {
      clearTimeout(blankTimer); blankTimer = null; blankLastTap = 0;
      showBlankMenu(e.clientX, e.clientY);
    } else {
      blankLastTap = now;
      clearTimeout(blankTimer);
      blankTimer = setTimeout(() => { blankLastTap = 0; }, 380);
    }
  });

  history = ['']; historyIdx = 0; navigateTo('', false);
}

    <div class="editor-bar"><span class="editor-path">/${escapeHtml(path)}</span><button class="mini-btn primary" data-save>保存</button></div>
    <textarea class="editor-body" spellcheck="false"></textarea></div>`;
  const ta = body.querySelector('.editor-body'); ta.value = content;

/* ============================================================
   计算器
   ============================================================ */
function buildCalculator(body) {
  const keys = [
    ['ac','AC','fn'],['neg','±','fn'],['pct','%','fn'],['/','÷','op'],
    ['7','7',''],['8','8',''],['9','9',''],['*','×','op'],
    ['4','4',''],['5','5',''],['6','6',''],['-','−','op'],
    ['1','1',''],['2','2',''],['3','3',''],['+','+','op'],
    ['0','0','span2'],['.','.',''],['=','=','eq']
  ];
  body.innerHTML = `<div class="calc"><div class="calc-disp" id="cd">0</div>
    <div class="calc-keys">${keys.map(k => `<button data-k="${k[0]}" class="${k[2]}">${k[1]}</button>`).join('')}</div></div>`;
  const dispEl = body.querySelector('#cd');
  let cur = '0', acc = null, op = null, fresh = true;
  const show = () => { let t = cur; if (t !== '错误' && t.length > 14) t = Number(t).toExponential(6); dispEl.textContent = t; };
  const apply = (a, b, o) => { switch (o) { case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return b === 0 ? NaN : a / b; } return b; };
  function press(k) {
    if (/^[0-9]$/.test(k)) {
      if (cur === '错误') { cur = '0'; fresh = true; }
      if (fresh) { cur = k; fresh = false; } else cur = cur === '0' ? k : cur + k;
      if (cur.replace('-','').replace('.','').length > 12) cur = cur.slice(0, cur[0] === '-' ? 13 : 12);
    } else if (k === '.') {
      if (cur === '错误') { cur = '0'; fresh = true; }
      if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.';
    } else if (k === 'ac') { cur = '0'; acc = null; op = null; fresh = true; }
    else if (k === 'neg') { if (cur !== '错误') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; }
    else if (k === 'pct') { if (cur !== '错误') cur = String(parseFloat(cur) / 100); }
    else if ('+-*/'.includes(k)) {
      const v = parseFloat(cur) || 0;
      if (op !== null && !fresh) { const r = apply(acc, v, op); acc = isNaN(r) || !isFinite(r) ? 0 : r; cur = String(+acc.toFixed(10)); }
      else acc = v;
      op = k; fresh = true;
    } else if (k === '=') {
      if (op !== null) { const r = apply(acc, parseFloat(cur) || 0, op); cur = isNaN(r) || !isFinite(r) ? '错误' : String(+r.toFixed(10)); acc = null; op = null; fresh = true; }
    }
    show();
  }
  body.querySelectorAll('.calc-keys button').forEach(b => b.onclick = () => press(b.dataset.k));
}

    </div>`;

  const listEl = body.querySelector('#notesList');
  const titleEl = body.querySelector('#noteTitle');
  const bodyEl = body.querySelector('#noteBody');
  const drawWrap = body.querySelector('#notesDraw');
  const drawCanvas = body.querySelector('#drawCanvas');
  const save = () => Store.set(KEY, notes);

  function renderList() {
    listEl.innerHTML = '';
    notes.forEach(n => {
      const d = document.createElement('div');
      d.className = 'note-item' + (n.id === curId ? ' active' : '');
      const thumb = n.type === 'draw'
        ? `<div class="ni-thumb">${n.thumb ? `<img src="${n.thumb}">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>`}</div>`
        : `<div class="ni-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5.5 3h10L19 6.5V20a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8.5 11h7M8.5 14.5h7"/></svg></div>`;
      d.innerHTML = thumb + `<div class="ni-body"><div class="ni-title">${escapeHtml(n.title || (n.type === 'draw' ? '绘画' : '新建备忘录'))}</div>
        <div class="ni-sub">${escapeHtml(n.type === 'draw' ? '绘画' : (n.body || '').replace(/\n/g, ' ').slice(0, 24))}</div></div>`;
      bindTap(d, {
        onSingle: () => { curId = n.id; renderList(); load(); },
        onDouble: (ev) => showNoteMenu(ev.clientX, ev.clientY, n)
      });
      listEl.appendChild(d);
    });
  }

  function load() {
    const n = notes.find(x => x.id === curId);
    if (!n) return;
    if (n.type === 'draw') {
      mode = 'draw';
      titleEl.value = n.title || '';
      titleEl.classList.remove('hide');
      bodyEl.classList.add('hide');
      drawWrap.classList.add('on');
      initDrawCanvas(n);
    } else {
      mode = 'text';
      titleEl.value = n.title || '';
      bodyEl.value = n.body || '';
      titleEl.classList.remove('hide');
      bodyEl.classList.remove('hide');
      drawWrap.classList.remove('on');
    }
  }

  let timer = null;
  function onEdit() {
    const n = notes.find(x => x.id === curId);
    if (!n || n.type !== 'text') return;
    n.title = titleEl.value; n.body = bodyEl.value; n.ts = Date.now();
    clearTimeout(timer);
    timer = setTimeout(() => { save(); renderList(); }, 300);
  }
  titleEl.addEventListener('input', onEdit);
  bodyEl.addEventListener('input', onEdit);

  let drawCtx = null, drawing = false, lastX = 0, lastY = 0;
  let drawColor = Store.get('draw.color', '#000000');
  let drawSize = Store.get('draw.size', 3);
  let drawTool = 'pen';
  let history = [];

  body.querySelectorAll('[data-draw-color]').forEach(el => {
    if (el.dataset.drawColor === drawColor) {
      body.querySelectorAll('[data-draw-color]').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
    }
    el.onclick = () => {
      drawColor = el.dataset.drawColor;
      drawTool = 'pen';
      body.querySelectorAll('[data-draw-color]').forEach(x => x.classList.toggle('active', x === el));
      body.querySelectorAll('[data-draw-tool]').forEach(x => x.classList.toggle('primary', false));
      if (drawCtx) drawCtx.strokeStyle = drawColor;
    };
  });
  body.querySelectorAll('[data-draw-tool]').forEach(b => {
    b.onclick = () => {
      drawTool = b.dataset.drawTool;
      body.querySelectorAll('[data-draw-tool]').forEach(x => x.classList.toggle('primary', x === b));
    };
  });
  const sizeInput = body.querySelector('[data-draw-size]');
  const sizeVal = body.querySelector('[data-draw-size-val]');
  sizeInput.value = drawSize; sizeVal.textContent = drawSize;
  sizeInput.oninput = () => { drawSize = +sizeInput.value; sizeVal.textContent = drawSize; };

  function resizeCanvas() {
    if (!drawCtx) return;
    const rect = drawCanvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const cw = Math.round(rect.width * dpr);
    const ch = Math.round(rect.height * dpr);
    if (drawCanvas.width === cw && drawCanvas.height === ch) return;
    const old = drawCanvas.toDataURL();
    drawCanvas.width = cw;
    drawCanvas.height = ch;
    drawCtx = drawCanvas.getContext('2d');
    drawCtx.scale(dpr, dpr);
    drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
    if (old && old.length > 100) {
      const img = new Image();
      img.onload = () => drawCtx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = old;
    }
  }

  function initDrawCanvas(n) {
    drawCanvas.width = 0;
    const rect = drawCanvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    drawCanvas.width = Math.round(rect.width * dpr);
    drawCanvas.height = Math.round(rect.height * dpr);
    drawCtx = drawCanvas.getContext('2d');
    drawCtx.scale(dpr, dpr);
    drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
    drawCtx.fillStyle = '#fff';
    drawCtx.fillRect(0, 0, rect.width, rect.height);
    if (n.data) {
      const img = new Image();
      img.onload = () => drawCtx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = n.data;
    }
    history = [];
  }

  drawCanvas.addEventListener('pointerdown', e => {
    if (!drawCtx) return;
    drawing = true;
    drawCanvas.setPointerCapture(e.pointerId);
    const rect = drawCanvas.getBoundingClientRect();
    lastX = e.clientX - rect.left;
    lastY = e.clientY - rect.top;
    if (history.length >= 30) history.shift();
    history.push(drawCanvas.toDataURL());
    drawCtx.strokeStyle = drawTool === 'eraser' ? '#fff' : drawColor;
    drawCtx.lineWidth = drawTool === 'eraser' ? drawSize * 3 : drawSize;
    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
  });
  drawCanvas.addEventListener('pointermove', e => {
    if (!drawing || !drawCtx) return;
    const rect = drawCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    drawCtx.lineTo(x, y);
    drawCtx.stroke();
    lastX = x; lastY = y;
  });
  drawCanvas.addEventListener('pointerup', e => {
    drawing = false;
    if (drawCanvas.hasPointerCapture(e.pointerId)) drawCanvas.releasePointerCapture(e.pointerId);
  });
  drawCanvas.addEventListener('pointercancel', () => { drawing = false; });

  body.querySelector('[data-draw-undo]').onclick = () => {
    if (!history.length || !drawCtx) return;
    const prev = history.pop();
    const rect = drawCanvas.parentElement.getBoundingClientRect();
    const img = new Image();
    img.onload = () => {
      drawCtx.clearRect(0, 0, rect.width, rect.height);
      drawCtx.fillStyle = '#fff';
      drawCtx.fillRect(0, 0, rect.width, rect.height);
      drawCtx.drawImage(img, 0, 0, rect.width, rect.height);
    };
    img.src = prev;
  };
  body.querySelector('[data-draw-clear]').onclick = async () => {
    if (!(await confirmDialog('清空当前画布？'))) return;
    const rect = drawCanvas.parentElement.getBoundingClientRect();
    drawCtx.clearRect(0, 0, rect.width, rect.height);
    drawCtx.fillStyle = '#fff';
    drawCtx.fillRect(0, 0, rect.width, rect.height);
  };
  body.querySelector('[data-draw-save]').onclick = () => {
    const n = notes.find(x => x.id === curId);
    if (!n || n.type !== 'draw') return;
    const dataUrl = drawCanvas.toDataURL('image/png');
    n.data = dataUrl;
    const thumbCanvas = document.createElement('canvas');
    const T = 64;
    thumbCanvas.width = T; thumbCanvas.height = T;
    const tctx = thumbCanvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      tctx.fillStyle = '#fff';
      tctx.fillRect(0, 0, T, T);
      tctx.drawImage(img, 0, 0, T, T);
      n.thumb = thumbCanvas.toDataURL('image/png');
      n.title = titleEl.value || '绘画 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      n.ts = Date.now();
      save(); renderList();
      toast('已保存');
    };
    img.src = dataUrl;
  };

  function showNoteMenu(x, y, n) {
    showMenu(x, y, [
      { label: '打开', action: () => { curId = n.id; renderList(); load(); } },
      { label: '重命名', action: async () => {
        const name = await promptDialog('重命名', n.title || '');
        if (name == null) return;
        n.title = name; save(); renderList();
        if (n.id === curId) titleEl.value = name;
      }},
      { label: '删除', danger: true, action: async () => {
        if (notes.length <= 1) { toast('至少保留一条'); return; }
        if (!(await confirmDialog(`删除「${n.title || '未命名'}」？`))) return;
        notes = notes.filter(x => x.id !== n.id);
        curId = notes[0].id; save(); renderList(); load();
      }}
    ]);
  }

  body.querySelector('[data-new-text]').onclick = () => {
    const n = { id: Date.now(), type: 'text', title: '', body: '', ts: Date.now() };
    notes.unshift(n); curId = n.id; save(); renderList(); load();
    titleEl.focus();
  };
  body.querySelector('[data-new-draw]').onclick = () => {
    const n = { id: Date.now(), type: 'draw', title: '', data: null, thumb: null, ts: Date.now() };
    notes.unshift(n); curId = n.id; save(); renderList(); load();
    setTimeout(() => { initDrawCanvas(n); resizeCanvas(); }, 100);
  };

  window.addEventListener('resize', () => { if (mode === 'draw') resizeCanvas(); });
  renderList(); load();
}
