<!DOCTYPE html>
<html lang="zh-CN" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Universe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3.5' y='3.5' width='7' height='7' rx='1.8' fill='%236a68f0'/%3E%3Crect x='13.5' y='3.5' width='7' height='7' rx='1.8' fill='%235ac8fa'/%3E%3Crect x='3.5' y='13.5' width='7' height='7' rx='1.8' fill='%23ff9500'/%3E%3Crect x='13.5' y='13.5' width='7' height='7' rx='1.8' fill='%2334c759'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css?v=69">
<link rel="stylesheet" href="css/layout.css?v=69">
<link rel="stylesheet" href="css/ui.css?v=69">
<link rel="stylesheet" href="css/apps.css?v=69">
</head>
<body>

<div id="statusbar">
  <div class="sb-left">
    <div class="sb-apple">●</div>
    <div class="sb-appname" id="sbAppName">Universe</div>
    <div class="sb-menus">
      <span class="sb-menu-item" data-menu="file">文件</span>
      <span class="sb-menu-item" data-menu="view">显示</span>
      <span class="sb-menu-item" data-menu="win">窗口</span>
      <span class="sb-menu-item" data-menu="help">帮助</span>
    </div>
  </div>
  <div class="sb-right">
    <div class="sb-icon" id="sbSearch"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg></div>
    <div class="sb-icon" id="sbWifi"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2.5 9.5a15 15 0 0 1 19 0"/><path d="M5.5 13a11 11 0 0 1 13 0"/><path d="M8.5 16.5a7 7 0 0 1 7 0"/><circle cx="12" cy="20" r="1.2" fill="currentColor" stroke="none"/></svg></div>
    <div class="sb-battery"><span id="sbBatteryPct">100%</span><div class="sb-icon"><svg width="18" height="12" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="2" width="18" height="12" rx="3"/><rect x="3.5" y="4.5" width="12" height="7" rx="1.2" fill="currentColor" stroke="none" id="sbBatteryFill"/><path d="M21 5.5v5a2 2 0 0 0 0-5z" fill="currentColor" stroke="none"/></svg></div></div>
    <div class="sb-icon" id="sbControl"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3.5" width="7" height="7" rx="1.8"/><rect x="14" y="3.5" width="7" height="7" rx="1.8"/><rect x="3" y="13.5" width="7" height="7" rx="1.8"/><rect x="14" y="13.5" width="7" height="7" rx="1.8"/></svg></div>
    <div class="sb-time" id="sbTime">--:--</div>
  </div>
</div>

<div id="desktop">
  <div id="wallpaper"></div>
  <div id="icons-layer"></div>
  <div id="ghost"></div>
  <div id="win-layer"></div>
</div>

<div id="ui-layer">
  <div id="dock">
    <button class="dock-item launch-btn" id="launchBtn">
      <span class="di-ic" style="background:linear-gradient(150deg,#6a68f0,#3634a3);color:#fff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
      </span>
    </button>
    <div class="dock-sep"></div>
    <div class="dock-inner" id="dockInner"></div>
  </div>
  <div id="home-indicator"></div>
  <div id="launcher">
    <div class="launcher-search"><input id="launcherInput" placeholder="搜索应用" autocomplete="off"></div>
    <div class="launcher-grid" id="launcherGrid"></div>
  </div>
</div>

<div id="control-center">
  <div class="cc-grid">
    <div class="cc-tile" data-cc="wifi">
      <span class="cc-tile-label">Wi-Fi</span>
      <span class="cc-tile-sub" id="ccWifiSub">已连接</span>
    </div>
    <div class="cc-tile" data-cc="bluetooth">
      <span class="cc-tile-label">蓝牙</span>
      <span class="cc-tile-sub" id="ccBtSub">关闭</span>
    </div>
    <div class="cc-tile" data-cc="dnd">
      <span class="cc-tile-label">勿扰</span>
      <span class="cc-tile-sub" id="ccDndSub">关闭</span>
    </div>
    <div class="cc-tile" data-cc="dark">
      <span class="cc-tile-label">深色模式</span>
      <span class="cc-tile-sub" id="ccDarkSub">开启</span>
    </div>
  </div>
  <div class="cc-slider-row">
    <label><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg></label>
    <input type="range" id="ccBrightness" min="20" max="100" step="1" value="100">
  </div>
  <div class="cc-slider-row">
    <label><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/><path d="M15.5 9.2a3.8 3.8 0 0 1 0 5.6"/></svg></label>
    <input type="range" id="ccVolume" min="0" max="100" step="1" value="80">
  </div>
  <div style="margin-top:8px;font-size:11px;color:var(--text-mute);text-align:center">控制中心</div>
</div>

<div id="startup-toast" class="toast" style="top:36px;bottom:auto">建议横屏使用，体验更佳</div>

<!-- ===== 加载顺序 = core → render → apps → system → boot（均为传统 script，file:// 可用，无绝对路径，GitHub Pages 子路径可用） ===== -->
<script src="js/core/store.js?v=69"></script>
<script src="js/core/config.js?v=69"></script>
<script src="js/core/theme.js?v=69"></script>
<script src="js/core/fs.js?v=69"></script>
<script src="js/core/zip.js?v=69"></script>
<script src="js/core/utils.js?v=69"></script>
<script src="js/core/sandbox.js?v=69"></script>

<script src="js/render/res.js?v=69"></script>
<script src="js/render/component.js?v=69"></script>
<script src="js/render/svg-icons.js?v=69"></script>
<script src="js/render/controls.js?v=69"></script>
<script src="js/render/dialog.js?v=69"></script>

<script src="js/system/layout.js?v=69"></script>
<script src="js/system/window-manager.js?v=69"></script>
<script src="js/system/spotlight.js?v=69"></script>
<script src="js/system/statusbar.js?v=69"></script>
<script src="js/system/control-center.js?v=69"></script>
<script src="js/system/dock.js?v=69"></script>
<script src="js/system/desktop.js?v=69"></script>
<script src="js/system/launcher.js?v=69"></script>

<script src="js/system/boot.js?v=69"></script>
</body>
</html>
