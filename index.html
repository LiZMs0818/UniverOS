   浏览器
   ============================================================ */
function buildBrowser(body) {
  const BOOKMARKS = [
    { name: 'Example', url: 'https://example.com' },
    { name: 'Bing', url: 'https://www.bing.com' },
    { name: 'Wikipedia', url: 'https://zh.wikipedia.org' },
    { name: 'MDN', url: 'https://developer.mozilla.org' }
  ];
  body.innerHTML = `<div class="br"><div class="br-bar">
      <button data-br="home">⌂</button><button data-br="reload">⟳</button>
      <input class="br-url" placeholder="输入网址或搜索" autocomplete="off" spellcheck="false"></div>
    <div class="br-view"><div class="br-home" data-br-home>
      <div class="br-tip">部分网站禁止被嵌入（X-Frame-Options / CSP），可能显示空白。</div>
      <div class="br-grid">${BOOKMARKS.map(b => `<button class="br-card" data-url="${b.url}"><span class="br-card-ic">🌐</span><span>${escapeHtml(b.name)}</span></button>`).join('')}</div>
    </div><iframe class="br-frame" data-br-frame referrerpolicy="no-referrer"></iframe></div></div>`;
  const frame = body.querySelector('[data-br-frame]');
  const homeEl = body.querySelector('[data-br-home]');
  const urlInput = body.querySelector('.br-url');
  function normalize(raw) {
    let u = (raw || '').trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^[\w-]+(\.[\w-]+)+([\/?#].*)?$/.test(u)) return 'https://' + u;
    return 'https://www.bing.com/search?q=' + encodeURIComponent(u);
  }
  function load(raw) {
    const u = normalize(raw); if (!u) return;
    urlInput.value = u; homeEl.style.display = 'none'; frame.style.display = 'block'; frame.src = u;
  }
  function goHome() { frame.style.display = 'none'; frame.src = 'about:blank'; homeEl.style.display = ''; urlInput.value = ''; }
  body.querySelector('[data-br="home"]').onclick = goHome;
  body.querySelector('[data-br="reload"]').onclick = () => { if (frame.style.display !== 'none' && frame.src) frame.src = frame.src; };
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); load(urlInput.value); } });
  homeEl.querySelectorAll('.br-card').forEach(c => c.onclick = () => load(c.dataset.url));
}

/* ============================================================
   桌面网格
   ============================================================ */
const deskEl = $('#desktop');
const iconsLayer = $('#icons-layer');
const ghostEl = $('#ghost');
const GRID = { cw: 100, ch: 112, padX: 20, padY: 34, cols: 6, rows: 4 };

function computeGrid() {
  const W = deskEl.clientWidth, H = deskEl.clientHeight;
  const cp = compact();
  GRID.cw = cp ? 82 : 100; GRID.ch = cp ? 94 : 112;
  GRID.padX = cp ? 10 : 20; GRID.padY = 34;
  const reserve = 104;
  GRID.cols = Math.max(1, Math.floor((W - GRID.padX * 2) / GRID.cw));
  GRID.rows = Math.max(1, Math.floor((H - GRID.padY - reserve) / GRID.ch));
}

const DEFAULT_DESKTOP = () => [
  { appId: 'files', col: 0, row: 0 },
  { appId: 'browser', col: 1, row: 0 },
  { appId: 'clock', col: 2, row: 0 }
];
const DEFAULT_DOCK = ['settings', 'calculator', 'notes', 'files'];

let desktopIcons = Store.get('desktop', null);
if (!desktopIcons) { desktopIcons = DEFAULT_DESKTOP(); Store.set('desktop', desktopIcons); }
let dockApps = Store.get('dock', null);
if (!dockApps) { dockApps = [...DEFAULT_DOCK]; Store.set('dock', dockApps); }
dockApps = dockApps.filter(id => APPS[id]);

function persistDesktop() { Store.set('desktop', desktopIcons); }
function persistDock() { Store.set('dock', dockApps); }
let lastDesktopApps = [], lastDockApps = [];

function findEmptyCell() {
  for (let row = 0; row < GRID.rows; row++) for (let col = 0; col < GRID.cols; col++)
    if (!desktopIcons.some(i => i.col === col && i.row === row)) return { col, row };
  return null;
}

function addToDesktop(appId) {
  if (!APPS[appId] || desktopIcons.some(i => i.appId === appId)) return false;
  const pos = findEmptyCell(); if (!pos) return false;
  desktopIcons.push({ appId, col: pos.col, row: pos.row });
  persistDesktop(); renderDesktop(); return true;
}
function addToDock(appId) {
  if (!APPS[appId] || dockApps.includes(appId)) return false;
  dockApps.push(appId); persistDock(); renderDock(); return true;
}
function dragDesktopToDock(appId) {
  const idx = desktopIcons.findIndex(i => i.appId === appId);
  if (idx >= 0) { const el = iconsLayer.children[idx]; if (el) el.classList.add('desk-leaving'); desktopIcons.splice(idx, 1); persistDesktop(); }
  const added = !dockApps.includes(appId);
  if (added) { dockApps.push(appId); persistDock(); }
  setTimeout(() => { renderDesktop(); if (added) renderDock(); }, 240);
}
function dragDockToDesktop(appId) {
  const d = dockInner.querySelector(`[data-app="${appId}"]`);
  if (d) d.classList.add('dock-leaving');
  dockApps = dockApps.filter(a => a !== appId); persistDock();
  const added = !desktopIcons.some(i => i.appId === appId);
  if (added) { const pos = findEmptyCell(); if (pos) { desktopIcons.push({ appId, col: pos.col, row: pos.row }); persistDesktop(); } }
  setTimeout(() => { renderDock(); if (added) renderDesktop(); }, 240);
}
function iconPos(el, col, row) {
  el.style.left = (GRID.padX + col * GRID.cw) + 'px';
  el.style.top = (GRID.padY + row * GRID.ch) + 'px';
}
function clampIcons() { desktopIcons.forEach(it => { it.col = clamp(it.col, 0, GRID.cols - 1); it.row = clamp(it.row, 0, GRID.rows - 1); }); }

function renderDesktop() {
  const oldSet = new Set(lastDesktopApps);
  iconsLayer.innerHTML = ''; ghostEl.classList.remove('on');
  desktopIcons.forEach((it, i) => {
    const app = APPS[it.appId]; if (!app) return;
    const el = document.createElement('div');
    el.className = 'desk-icon'; if (!oldSet.has(it.appId)) el.classList.add('desk-new');
    el.style.width = GRID.cw + 'px'; el.style.height = GRID.ch + 'px';
    el.innerHTML = `<div class="ic" style="background:${app.bg};color:${app.fg}">${app.icon}</div><div class="lb">${escapeHtml(app.name)}</div>`;
    iconPos(el, it.col, it.row);

    let dragging = false, dragTarget = null, startP = null, startLeft = 0, startTop = 0;
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startP = getLocalPoint(e); startLeft = parseFloat(el.style.left) || 0; startTop = parseFloat(el.style.top) || 0; dragging = false;
    });
    el.addEventListener('pointermove', e => {
      if (!startP) return;
      const p = getLocalPoint(e); const dx = p.x - startP.x, dy = p.y - startP.y;
      if (!dragging && Math.hypot(dx, dy) < 8) return;
      dragging = true; el.classList.add('dragging'); ghostEl.classList.add('on');
      let nl = startLeft + dx, nt = startTop + dy;
      nl = clamp(nl, -GRID.cw * 0.4, deskEl.clientWidth - GRID.cw * 0.6);
      nt = clamp(nt, -GRID.ch * 0.4, deskEl.clientHeight - GRID.ch * 0.6);
      el.style.left = nl + 'px'; el.style.top = nt + 'px';
      const col = clamp(Math.round((nl - GRID.padX) / GRID.cw), 0, GRID.cols - 1);
      const row = clamp(Math.round((nt - GRID.padY) / GRID.ch), 0, GRID.rows - 1);
      dragTarget = { col, row };
      ghostEl.style.left = (GRID.padX + col * GRID.cw) + 'px';
      ghostEl.style.top = (GRID.padY + row * GRID.ch) + 'px';
      ghostEl.style.width = GRID.cw + 'px'; ghostEl.style.height = GRID.ch + 'px';
      const dr = dockEl.getBoundingClientRect();
      dockEl.classList.toggle('dock-target', e.clientX >= dr.left && e.clientX <= dr.right && e.clientY >= dr.top && e.clientY <= dr.bottom);
    });
    el.addEventListener('pointerup', e => {
      const wasDragging = dragging;
      if (startP) {
        el.classList.remove('dragging'); ghostEl.classList.remove('on'); dockEl.classList.remove('dock-target');
        if (wasDragging) {
          const dr = dockEl.getBoundingClientRect();
          const willToDock = e.clientX >= dr.left && e.clientX <= dr.right && e.clientY >= dr.top && e.clientY <= dr.bottom;
          if (willToDock) dragDesktopToDock(it.appId);
          else if (dragTarget) dropIcon(i, dragTarget.col, dragTarget.row, el);
          else renderDesktop();
        }
        startP = null; dragging = false; dragTarget = null;
      }
    });
    el.addEventListener('pointercancel', () => {
      if (startP) { startP = null; dragging = false; el.classList.remove('dragging'); ghostEl.classList.remove('on'); renderDesktop(); }
    });

    bindTap(el, {
      onSingle: () => openApp(it.appId),
      onDouble: (ev) => showIconMenu(ev.clientX, ev.clientY, i),
      isDragging: () => dragging
    });
    el.addEventListener('contextmenu', e => { e.preventDefault(); showIconMenu(e.clientX, e.clientY, i); });
    iconsLayer.appendChild(el);
  });
  lastDesktopApps = desktopIcons.map(i => i.appId);
}

function dropIcon(fromIdx, col, row, el) {
  const from = desktopIcons[fromIdx]; if (!from) return;
  const occ = desktopIcons.findIndex((x, i) => i !== fromIdx && x.col === col && x.row === row);
  if (occ >= 0) { desktopIcons[occ].col = from.col; desktopIcons[occ].row = from.row; }
  from.col = col; from.row = row; persistDesktop();
  const children = Array.from(iconsLayer.children);
  el.classList.remove('dragging'); void el.offsetWidth;
  desktopIcons.forEach((it, i) => { const c = children[i]; if (c) iconPos(c, it.col, it.row); });
}

deskEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.ctxmenu-popup') || e.target.closest('.modal-overlay')) return;
  if (!e.target.closest('.desk-icon')) $$('.desk-icon', iconsLayer).forEach(n => n.classList.remove('pressed'));
  hideMenu();
}, true);

let menuLayers = [], menuAnchorEl = null;
function clearMenuAnchor() { if (menuAnchorEl && menuAnchorEl.isConnected) menuAnchorEl.classList.remove('menu-anchor'); menuAnchorEl = null; }
function isMenuOpen() { return menuLayers.length > 0; }
function hideMenu() { menuLayers.forEach(el => el.remove()); menuLayers = []; clearMenuAnchor(); }

function buildMenuLayer(items, x, y, parentRect) {
  const el = document.createElement('div');
  el.className = 'ctxmenu-popup'; el.style.zIndex = 20000 + menuLayers.length;
  items.forEach(it => {
    if (it.sep) { const s = document.createElement('div'); s.className = 'ctx-sep'; el.appendChild(s); return; }
    const b = document.createElement('div');
    b.className = 'ctx-item' + (it.danger ? ' danger' : '') + (it.disabled ? ' disabled' : '');
    b.innerHTML = `<span>${escapeHtml(it.label)}</span>` + (it.children ? '<span class="sub-arrow">›</span>' : '');
    if (it.children && !it.disabled) {
      const open = (ev) => {
        ev.stopPropagation();
        const r = b.getBoundingClientRect();
        const idx = menuLayers.indexOf(el);
        if (idx >= 0) { menuLayers.slice(idx + 1).forEach(n => n.remove()); menuLayers.length = idx + 1; }
        buildMenuLayer(it.children, r.right + 4, r.top, r);
      };
      b.addEventListener('mouseenter', open); b.addEventListener('click', open);
    } else if (!it.disabled && it.action) {
      b.addEventListener('click', (ev) => { ev.stopPropagation(); hideMenu(); it.action(); });
    }
    el.appendChild(b);
  });
  document.body.appendChild(el);
  let left = x, top = y; const w = el.offsetWidth, h = el.offsetHeight;
  if (parentRect) { if (left + w > innerWidth - 8) left = parentRect.left - w - 4; if (top + h > innerHeight - 8) top = innerHeight - h - 8; }
  else { if (left + w > innerWidth - 8) left = innerWidth - w - 8; if (top + h > innerHeight - 8) top = innerHeight - h - 8; }
  el.style.left = Math.max(8, left) + 'px'; el.style.top = Math.max(8, top) + 'px';
  menuLayers.push(el); return el;
}

function showMenu(x, y, items, anchorEl) {
  hideMenu();
  if (anchorEl && anchorEl.isConnected) { anchorEl.classList.add('menu-anchor'); menuAnchorEl = anchorEl; }
  buildMenuLayer(items, x, y, null);
}

document.addEventListener('pointerdown', (e) => {
  if (!isMenuOpen()) return;
  if (e.target.closest('.ctxmenu-popup')) return;
  hideMenu();
}, true);

function showIconMenu(x, y, idx) {
  const it = desktopIcons[idx]; if (!it) return;
  const app = APPS[it.appId];

function relayout() {
  computeGrid(); clampIcons(); persistDesktop(); renderDesktop(); renderDock();
  wins.forEach(w => {
    if (w.maxed) { w.el.style.top = '28px'; w.el.style.width = deskEl.clientWidth + 'px'; w.el.style.height = (deskEl.clientHeight - 28) + 'px'; }
    else {
      w.el.style.left = clamp(w.el.offsetLeft, -w.el.offsetWidth + 90, deskEl.clientWidth - 90) + 'px';
      w.el.style.top = clamp(w.el.offsetTop, 34, deskEl.clientHeight - 46) + 'px';
      saveWindowRect(w);
    }
  });
  scheduleDockCheck();
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(relayout, 140);
});

function init() {
  applyWallpaper();
  computeGrid(); clampIcons(); persistDesktop(); persistDock();
  lastDesktopApps = desktopIcons.map(i => i.appId);
  lastDockApps = [...dockApps];
  renderDesktop(); renderDock(); renderLauncher(); scheduleDockCheck();
  const uiScale = Store.get('uiScale', 1);
  document.documentElement.style.fontSize = (16 * uiScale) + 'px';
  FS.backend().then(be => {
    if (be !== 'opfs') setTimeout(() => toast('沙箱环境，文件保存在内存中。部署后自动启用持久化。', 4000), 1200);
  });
}

/* ============ 启动动画控制 ============ */
(function () {
  const bootScreen = document.getElementById('bootScreen');
  const bootParts = document.getElementById('bootParts');
  const versionEl = document.getElementById('bootVersion');

  const APP_VERSION = (window.UNIVERSE_VERSION) || '1.8.2';
  versionEl.textContent = APP_VERSION;

  const T = { inDone: 1200, expand: 350, hold: 3200, totalFade: 900 };

  function runBoot() {
    setTimeout(() => {
      const uni = bootParts.querySelector('.bp-uni');
      const ver = bootParts.querySelector('.bp-ver');
      const se  = bootParts.querySelector('.bp-se');
      [uni, ver, se].forEach(el => {
        if (!el) return;
        el.style.opacity = '1';
        el.style.filter = 'none';
      });
    }, T.inDone - 50);

    setTimeout(() => {
      bootParts.classList.add('expanded');
      setTimeout(() => {
        bootScreen.classList.add('fade-out');
        setTimeout(() => {
          bootScreen.classList.add('hidden');
          window.dispatchEvent(new CustomEvent('universe:booted'));
        }, T.totalFade);
      }, T.hold);
    }, T.inDone + T.expand);
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(runBoot);
  else runBoot();
})();

init();
</script>
